# Compose de produção para Dokploy.
#
# Pressupostos:
#   - Postgres roda fora deste compose (criado como "Database" no painel do
#     Dokploy). DATABASE_URL e LOGTO_DB_URL devem apontar pra ele.
#   - Dokploy provê a rede externa `dokploy-network` com Traefik na frente.
#     Traefik faz roteamento HTTPS automático (Let's Encrypt) por subdomínio.
#   - Variáveis ficam todas no painel do Dokploy (env do projeto). Este compose
#     só referencia ${VAR}; .env.production.example documenta os nomes.
#   - Três serviços: web (PWA), api (NestJS+MCP), auth (Logto). Cada um tem
#     subdomínio próprio. App = app.${DOMAIN}, API = api.${DOMAIN},
#     Auth = auth.${DOMAIN}.

# O default do driver `json-file` é **sem rotação nenhuma** — o arquivo cresce até o disco
# acabar. Com Prometheus, Loki e Tempo dividindo o mesmo VPS, encher o disco deixa de ser
# incômodo e passa a derrubar o Postgres *e* o `backup.sh` junto. 10 MB × 3 arquivos = teto de
# 30 MB por container. Ver `docs/DATA_RETENTION.md` §"Retenção dos logs".
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  # ============================================================
  # Backend (NestJS REST + MCP)
  # ============================================================
  api:
    logging: *logging
    image: ${API_IMAGE:-fatia-api:latest}
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      LOGTO_ENDPOINT: https://auth.${DOMAIN}
      LOGTO_AUDIENCE: ${LOGTO_AUDIENCE:-https://api.${DOMAIN}}
      WEB_ORIGIN: https://app.${DOMAIN}
      LOGTO_MCP_APP_ID: ${LOGTO_MCP_APP_ID}
      LOGTO_MCP_APP_SECRET: ${LOGTO_MCP_APP_SECRET}
      # Management API do Logto: apagar a identidade junto da conta e ler o e-mail no
      # primeiro acesso. Vazio = a conta nasce com e-mail provisório.
      LOGTO_M2M_APP_ID: ${LOGTO_M2M_APP_ID:-}
      LOGTO_M2M_APP_SECRET: ${LOGTO_M2M_APP_SECRET:-}
      # Observabilidade (#39). Vazio = instrumentação inerte, sem exportador e sem overhead:
      # a API sobe igual mesmo sem o stack de observabilidade implantado. Para ligar, aponte
      # para o collector na `dokploy-network` — ver `docs/OPERATIONS.md` §Observabilidade.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-fatia-api}
      # Como a API alcança o agente (chat e foto do prato). Vazio = as duas
      # funcionalidades somem da interface e o resto segue inteiro. Dentro deste
      # compose: AGENT_BASE_URL=http://agent:8100.
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_TIMEOUT_MS: ${AGENT_TIMEOUT_MS:-180000}
      # Custo e cota da IA hospedada (#135) — quem aplica é a API, que tem o banco.
      AI_PRICE_TABLE: ${AI_PRICE_TABLE:-}
      AI_QUOTA_DAILY_MICROS: ${AI_QUOTA_DAILY_MICROS:-0}
      AI_QUOTA_GLOBAL_DAILY_MICROS: ${AI_QUOTA_GLOBAL_DAILY_MICROS:-0}
      AI_QUOTA_UNPRICED_DAILY_CALLS: ${AI_QUOTA_UNPRICED_DAILY_CALLS:-20}
      # Plano Free/PRO e assentos (ADR 024/025). A instância pública usa true.
      AI_REQUIRES_PLAN: ${AI_REQUIRES_PLAN:-false}
      BILLING_PRO_MONTHLY_CENTS: ${BILLING_PRO_MONTHLY_CENTS:-1990}
      BILLING_PRO_YEARLY_CENTS: ${BILLING_PRO_YEARLY_CENTS:-17900}
      BILLING_SEAT_MONTHLY_CENTS: ${BILLING_SEAT_MONTHLY_CENTS:-1490}
      # Asaas (PRO pela web e assentos). Vazio = checkout responde 503.
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      # RevenueCat (compra no app). Vazio = webhook e sync respondem 503.
      REVENUECAT_WEBHOOK_AUTH: ${REVENUECAT_WEBHOOK_AUTH:-}
      REVENUECAT_SECRET_KEY: ${REVENUECAT_SECRET_KEY:-}
      REVENUECAT_ENTITLEMENT_ID: ${REVENUECAT_ENTITLEMENT_ID:-pro}
      # E-mail do convite de comunidade. Vazio = só o link, sem e-mail.
      MAIL_SMTP_URL: ${MAIL_SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-Fatia <nao-responda@fat.ia.br>}
      # Avisos no celular pela Expo (ADR 033). A instância pública usa true.
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # Mídia da comunidade no Cloudflare R2 (ADR 028). Vazio = envio de imagem
      # responde 503. Bucket privado e CORS para https://app.${DOMAIN}: ver
      # docs/OPERATIONS.md §Mídia.
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-auto}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
    expose:
      - "3000"
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTP → redirect 301 para HTTPS
      - traefik.http.routers.fatia-api-http.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.fatia-api-http.entrypoints=web
      - traefik.http.routers.fatia-api-http.middlewares=fatia-api-redirect
      - traefik.http.middlewares.fatia-api-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.fatia-api-redirect.redirectscheme.permanent=true
      # HTTPS
      - traefik.http.routers.fatia-api.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.fatia-api.entrypoints=websecure
      - traefik.http.routers.fatia-api.tls=true
      - traefik.http.routers.fatia-api.tls.certresolver=letsencrypt
      - traefik.http.services.fatia-api.loadbalancer.server.port=3000
      # Habilita CORS pré-flight no Traefik (a API também faz CORS, redundância proposital)
      - traefik.http.routers.fatia-api.middlewares=fatia-api-headers
      - traefik.http.middlewares.fatia-api-headers.headers.accesscontrolallowmethods=GET,POST,PATCH,PUT,DELETE,OPTIONS
      - traefik.http.middlewares.fatia-api-headers.headers.accesscontrolallowheaders=Authorization,Content-Type
      - traefik.http.middlewares.fatia-api-headers.headers.accesscontrolalloworiginlist=https://app.${DOMAIN}
      - traefik.http.middlewares.fatia-api-headers.headers.accesscontrolallowcredentials=true
      - traefik.http.middlewares.fatia-api-headers.headers.accesscontrolmaxage=600

  # ============================================================
  # Agente de IA (apps/agent, ADR 015) — só rede interna
  # Sem labels do Traefik e sem porta publicada: quem fala com ele é a `api`,
  # com o X-Fatia-Agent-Key. Ele fala com o /mcp da `api` pelo nome do serviço.
  # ============================================================
  agent:
    logging: *logging
    image: ${AGENT_IMAGE:-fatia-agent:latest}
    build:
      context: ..
      dockerfile: infra/agent.Dockerfile
    restart: unless-stopped
    environment:
      # Host e modelo de produção precisam estar em allowed_models.py; fora da
      # lista, a capacidade recusa antes de qualquer byte sair.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_TEXT: ${AI_MODEL_TEXT:-}
      AI_MODEL_VISION: ${AI_MODEL_VISION:-}
      AI_MODEL_EMBEDDING: ${AI_MODEL_EMBEDDING:-}
      AI_MODEL_TRANSCRIPTION: ${AI_MODEL_TRANSCRIPTION:-}
      AI_TIMEOUT_S: ${AI_TIMEOUT_S:-120}
      # Novas tentativas do provedor antes do primeiro token (429, 5xx, conexão).
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://api:3000/mcp}
      MCP_TIMEOUT_S: ${MCP_TIMEOUT_S:-30}
      # Mesmo Postgres da API; o agente cria o schema `agent_checkpoint` (ADR 023).
      AGENT_CHECKPOINT_DATABASE_URL: ${AGENT_CHECKPOINT_DATABASE_URL:-}
      # Langfuse (ADR 034). Sem as chaves, nada sai.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_SAMPLE_RATE: ${LANGFUSE_SAMPLE_RATE:-1.0}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
    expose:
      - "8100"
    depends_on:
      - api
    networks:
      - dokploy-network
    # O `/health` responde 200 mesmo sem IA ou sem Postgres (ver api.py): o que
    # isto pega é o processo travado ou morto, não a dependência fora do ar.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # 384M ficava no limite com o pool do checkpointer e um turno com
          # foto em base64 na memória; um OOM derruba todos os turnos abertos.
          memory: 512M

  # ============================================================
  # Frontend (Next.js PWA)
  # ============================================================
  web:
    logging: *logging
    image: ${WEB_IMAGE:-fatia-web:latest}
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        # NEXT_PUBLIC_* são embedados no bundle, precisam estar disponíveis no build.
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      # Logto SDK do Next.js (server actions + route handlers)
      LOGTO_ENDPOINT: https://auth.${DOMAIN}
      LOGTO_APP_ID: ${LOGTO_APP_ID}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET}
      LOGTO_COOKIE_SECRET: ${LOGTO_COOKIE_SECRET}
      LOGTO_BASE_URL: https://app.${DOMAIN}
      LOGTO_AUDIENCE: ${LOGTO_AUDIENCE:-https://api.${DOMAIN}}
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
      # Link universal do convite no app (/.well-known/*). Vazio = 404, abre o PWA.
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    expose:
      - "3001"
    depends_on:
      - api
      - auth
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 384M
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.fatia-web-http.rule=Host(`app.${DOMAIN}`)
      - traefik.http.routers.fatia-web-http.entrypoints=web
      - traefik.http.routers.fatia-web-http.middlewares=fatia-web-redirect
      - traefik.http.middlewares.fatia-web-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.fatia-web-redirect.redirectscheme.permanent=true
      - traefik.http.routers.fatia-web.rule=Host(`app.${DOMAIN}`)
      - traefik.http.routers.fatia-web.entrypoints=websecure
      - traefik.http.routers.fatia-web.tls=true
      - traefik.http.routers.fatia-web.tls.certresolver=letsencrypt
      - traefik.http.services.fatia-web.loadbalancer.server.port=3001

  # ============================================================
  # Site institucional + landing do conector (estático)
  # Ocupa o domínio RAIZ, que estava livre — o app vive em app.${DOMAIN}.
  # Assim a landing não mexe em rota, start_url do PWA nem manifest.
  # ============================================================
  site:
    logging: *logging
    image: ${SITE_IMAGE:-fatia-site:latest}
    build:
      context: ..
      dockerfile: infra/site.Dockerfile
      args:
        # Estático: o domínio entra no HTML durante o build.
        PUBLIC_DOMAIN: ${DOMAIN}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          # Só nginx servindo arquivo — não precisa de mais que isso.
          memory: 64M
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.fatia-site-http.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.fatia-site-http.entrypoints=web
      - traefik.http.routers.fatia-site-http.middlewares=fatia-site-redirect
      - traefik.http.middlewares.fatia-site-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.fatia-site-redirect.redirectscheme.permanent=true
      - traefik.http.routers.fatia-site.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.fatia-site.entrypoints=websecure
      - traefik.http.routers.fatia-site.tls=true
      - traefik.http.routers.fatia-site.tls.certresolver=letsencrypt
      - traefik.http.services.fatia-site.loadbalancer.server.port=80
      # www.${DOMAIN} redireciona para o apex, para não haver conteúdo duplicado.
      - traefik.http.routers.fatia-site-www.rule=Host(`www.${DOMAIN}`)
      - traefik.http.routers.fatia-site-www.entrypoints=websecure
      - traefik.http.routers.fatia-site-www.tls=true
      - traefik.http.routers.fatia-site-www.tls.certresolver=letsencrypt
      - traefik.http.routers.fatia-site-www.middlewares=fatia-site-www-redirect
      - traefik.http.routers.fatia-site-www.service=fatia-site
      - traefik.http.middlewares.fatia-site-www-redirect.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.fatia-site-www-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.fatia-site-www-redirect.redirectregex.permanent=true

  # ============================================================
  # Identity Provider (Logto self-hosted)
  # ============================================================
  auth:
    logging: *logging
    image: svhd/logto:${LOGTO_VERSION:-1.30}
    restart: unless-stopped
    environment:
      DB_URL: ${LOGTO_DB_URL}
      ENDPOINT: https://auth.${DOMAIN}
      # O admin SPA do Logto sempre serve em / na porta ADMIN_PORT.
      # Roteamento por path (/admin) não funciona — usa subdomínio separado.
      ADMIN_ENDPOINT: https://logto-admin.${DOMAIN}
      TRUST_PROXY_HEADER: 1
      PORT: 3001
      ADMIN_PORT: 3002
    expose:
      - "3001"
      - "3002"
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512M
    # Logto roda migrations próprias na primeira execução (~30s).
    # Usa entrypoint (não command) pois a imagem svhd/logto tem ENTRYPOINT próprio
    # que interceptaria o command, causando "npm error Missing script: sh".
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Endpoint público do Logto (login, /oidc, /.well-known) — porta 3001
      - traefik.http.routers.fatia-auth-http.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.fatia-auth-http.entrypoints=web
      - traefik.http.routers.fatia-auth-http.middlewares=fatia-auth-redirect
      - traefik.http.middlewares.fatia-auth-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.fatia-auth-redirect.redirectscheme.permanent=true
      - traefik.http.routers.fatia-auth.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.fatia-auth.entrypoints=websecure
      - traefik.http.routers.fatia-auth.tls=true
      - traefik.http.routers.fatia-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.fatia-auth.service=fatia-auth
      - traefik.http.services.fatia-auth.loadbalancer.server.port=3001
      # Console admin do Logto — subdomínio separado, porta 3002
      - traefik.http.routers.fatia-auth-admin-http.rule=Host(`logto-admin.${DOMAIN}`)
      - traefik.http.routers.fatia-auth-admin-http.entrypoints=web
      - traefik.http.routers.fatia-auth-admin-http.middlewares=fatia-auth-admin-redirect
      - traefik.http.middlewares.fatia-auth-admin-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.fatia-auth-admin-redirect.redirectscheme.permanent=true
      - traefik.http.routers.fatia-auth-admin.rule=Host(`logto-admin.${DOMAIN}`)
      - traefik.http.routers.fatia-auth-admin.entrypoints=websecure
      - traefik.http.routers.fatia-auth-admin.tls=true
      - traefik.http.routers.fatia-auth-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.fatia-auth-admin.service=fatia-auth-admin
      - traefik.http.services.fatia-auth-admin.loadbalancer.server.port=3002

networks:
  dokploy-network:
    external: true
