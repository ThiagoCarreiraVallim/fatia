# Loki monolítico, storage em filesystem. Sem anel de consistência, sem object storage:
# um VPS, um processo, um volume.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Necessário para a ingestão OTLP: é onde `trace_id` e `span_id` são guardados sem virar
  # label (label por trace_id explodiria o índice). É o que permite o link log → trace.
  allow_structured_metadata: true
  retention_period: 168h
  # Rejeitar log antigo demais evita que um lote atrasado de um container reiniciado reescreva
  # índice já compactado.
  reject_old_samples: true
  reject_old_samples_max_age: 24h

compactor:
  working_directory: /loki/compactor
  # A retenção só é aplicada de fato se o compactor estiver com delete habilitado — sem isto o
  # `retention_period` acima é decorativo e o disco cresce para sempre.
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
