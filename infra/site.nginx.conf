server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects relativos. Com o default (`absolute_redirect on`) o nginx monta a
    # URL a partir do que ele mesmo escuta — atrás do Traefik isso devolveria
    # `http://host:80/...` no lugar de `https://fat.ia.br/...`, quebrando o
    # redirect de `/claude-connect` para `/claude-connect/`.
    absolute_redirect off;
    server_tokens off;

    # `build.format: 'directory'` no astro.config faz cada rota virar um
    # diretório com index.html, então o try_files resolve /claude-connect/ direto.
    location / {
        try_files $uri $uri/ $uri/index.html =404;

        # ATENÇÃO: no nginx, um `add_header` dentro de um location DESCARTA todos
        # os herdados do server. Por isso os headers de segurança são repetidos
        # em cada bloco que declara header próprio, em vez de ficarem só acima.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HTML nunca em cache longo: é o que muda quando o site é republicado.
        add_header Cache-Control "no-cache" always;
    }

    # Assets do Astro (CSS e fontes) têm hash no nome — cache agressivo é seguro.
    location /_astro/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /icons/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
    }

    # woff2 já é comprimido — recomprimir só gasta CPU.
    gzip on;
    gzip_types text/html text/css application/json image/svg+xml;
    gzip_min_length 1024;

    access_log off;
}
