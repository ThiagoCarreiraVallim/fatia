services:
  postgres:
    image: postgres:16-alpine
    container_name: fatia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fatia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fatia_dev}
      # Cria a database principal. A database do Logto é criada via init script.
      POSTGRES_DB: ${POSTGRES_DB:-fatia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fatia_pg_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fatia}"]
      interval: 5s
      timeout: 3s
      retries: 10

  logto:
    # Pinned: :latest pulls cloud-tracking builds that can ship breaking auth-console changes.
    # 1.39.0 tem bug conhecido em OSS: admin criado pelo signup não recebe o role
    # `Logto Management API access` no tenant default → console abre mas todas as
    # chamadas a /api/* retornam 401. 1.36.0 é estável.
    image: svhd/logto:1.36.0
    container_name: fatia-logto
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Conexão à database dedicada do Logto (criada pelo postgres-init/01-create-logto-db.sh)
      DB_URL: postgresql://${POSTGRES_USER:-fatia}:${POSTGRES_PASSWORD:-fatia_dev}@postgres:5432/logto
      # URLs públicas. Em local mantemos os defaults do Logto (3001 OIDC, 3002 admin)
      # pra evitar mismatch entre o admin SPA e a Management API. Em prod o Dokploy
      # injeta os subdomínios reais e TRUST_PROXY_HEADER=1 (override via env).
      ENDPOINT: ${LOGTO_ENDPOINT:-http://localhost:3001}
      ADMIN_ENDPOINT: ${LOGTO_ADMIN_ENDPOINT:-http://localhost:3002}
      TRUST_PROXY_HEADER: ${LOGTO_TRUST_PROXY:-0}
    ports:
      # Defaults do Logto: 3001 OIDC público, 3002 console admin. NÃO desloque
      # (o admin SPA tem URLs codificadas com esses ports internos).
      - "${LOGTO_PORT:-3001}:3001"
      - "${LOGTO_ADMIN_PORT:-3002}:3002"
    # `db seed --swe` (idempotente) cria schema + seed software-engineer (necessário
    # pros admin roles serem assinados corretamente). Primeira execução ~30s.
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]

  mailpit:
    # SMTP de mentira para desenvolvimento: captura todo e-mail que o Logto manda
    # (verificação de cadastro, código de "esqueci minha senha") e mostra numa
    # caixa de entrada web em http://localhost:8025. Nada sai para a internet.
    # Em produção o conector aponta para um SMTP real (EMAIL_SMTP_*).
    image: axllent/mailpit:v1.27
    container_name: fatia-mailpit
    restart: unless-stopped
    environment:
      # O conector SMTP do Logto exige usuário/senha; o Mailpit aceita qualquer um.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    container_name: fatia-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      logto:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fatia}:${POSTGRES_PASSWORD:-fatia_dev}@postgres:5432/${POSTGRES_DB:-fatia}
      # Auth via Logto (ADR 008)
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT}
      LOGTO_AUDIENCE: ${LOGTO_AUDIENCE}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3030}
      PORT: 3000
      # Reconhecimento de refeição por foto (#139). Vazio = a funcionalidade
      # some da interface e o registro manual continua inteiro; a API não sobe
      # degradada nem falha por causa disso.
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_TIMEOUT_MS: ${AGENT_TIMEOUT_MS:-180000}
      # Custo e cota da IA hospedada (#135). Vazio/0 = sem cota.
      AI_PRICE_TABLE: ${AI_PRICE_TABLE:-}
      AI_QUOTA_DAILY_MICROS: ${AI_QUOTA_DAILY_MICROS:-0}
      AI_QUOTA_GLOBAL_DAILY_MICROS: ${AI_QUOTA_GLOBAL_DAILY_MICROS:-0}
      AI_QUOTA_UNPRICED_DAILY_CALLS: ${AI_QUOTA_UNPRICED_DAILY_CALLS:-20}
      # Plano Free/PRO (ADR 024). false = IA hospedada liberada para todos.
      AI_REQUIRES_PLAN: ${AI_REQUIRES_PLAN:-false}
      BILLING_PRO_MONTHLY_CENTS: ${BILLING_PRO_MONTHLY_CENTS:-1990}
      BILLING_PRO_YEARLY_CENTS: ${BILLING_PRO_YEARLY_CENTS:-17900}
      BILLING_SEAT_MONTHLY_CENTS: ${BILLING_SEAT_MONTHLY_CENTS:-1490}
      # Asaas (cobrança web). Vazio = cobrança desligada.
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      # RevenueCat (compra no app). Vazio = webhook e sync respondem 503.
      REVENUECAT_WEBHOOK_AUTH: ${REVENUECAT_WEBHOOK_AUTH:-}
      REVENUECAT_SECRET_KEY: ${REVENUECAT_SECRET_KEY:-}
      REVENUECAT_ENTITLEMENT_ID: ${REVENUECAT_ENTITLEMENT_ID:-pro}
      # E-mail do convite de comunidade. Fixo: dentro deste compose o Mailpit é
      # `mailpit`, e o MAIL_SMTP_URL do .env aponta para localhost (a API no host).
      MAIL_SMTP_URL: smtp://fatia:fatia@mailpit:1025
      EMAIL_FROM: ${EMAIL_FROM:-Fatia <nao-responda@fatia.local>}
    ports:
      - "${API_PORT:-3000}:3000"
    profiles: ["full"]

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    container_name: fatia-web
    restart: unless-stopped
    depends_on:
      - api
      - logto
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      # Logto SDK no Next.js
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT}
      LOGTO_APP_ID: ${LOGTO_APP_ID}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET}
      LOGTO_COOKIE_SECRET: ${LOGTO_COOKIE_SECRET}
      LOGTO_BASE_URL: ${LOGTO_BASE_URL:-http://localhost:3030}
      # Link universal do convite (/.well-known/*). Vazio = 404, o link abre o PWA.
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      PORT: 3030
    ports:
      - "${WEB_PORT:-3030}:3030"
    profiles: ["full"]

  # Agente de IA (ADR 015). Perfil próprio, e não `full`: ainda não há consumidor,
  # e um `infra:up:full` não deve passar a subir um serviço a mais sem pedir.
  #   docker compose --env-file .env -f infra/docker-compose.yml --profile agent up -d agent
  agent:
    build:
      context: ..
      dockerfile: infra/agent.Dockerfile
    container_name: fatia-agent
    restart: unless-stopped
    environment:
      # De dentro do container, o LM Studio do host é `host.docker.internal`.
      # Vazio = o serviço sobe e degrada explicitamente; ver apps/agent/README.md.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_TEXT: ${AI_MODEL_TEXT:-}
      AI_MODEL_VISION: ${AI_MODEL_VISION:-}
      AI_MODEL_EMBEDDING: ${AI_MODEL_EMBEDDING:-}
      AI_MODEL_TRANSCRIPTION: ${AI_MODEL_TRANSCRIPTION:-}
      AI_TIMEOUT_S: ${AI_TIMEOUT_S:-120}
      # Segredo compartilhado com o apps/api. Obrigatório quando AI_BASE_URL
      # não é local — ver apps/agent/README.md, §"Rotas de inferência".
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      # /mcp do apps/api — o único destino do Bearer do usuário (ADR 021). De
      # dentro do container o apps/api é `api`, não `localhost`, e o agente
      # aceita esse nome em http por ele não sair da rede do compose. Vazio = a
      # rota /chat degrada com erro nomeado e o resto do agente segue de pé.
      MCP_BASE_URL: ${MCP_BASE_URL:-}
      MCP_TIMEOUT_S: ${MCP_TIMEOUT_S:-30}
      # O Postgres da Fatia, onde o estado das conversas fica no schema
      # `agent_checkpoint` (ADR 023). Vazio = em memória: uma pausa do chat
      # (confirmação, pergunta) morre num restart. De dentro do compose o banco
      # é `postgres`.
      AGENT_CHECKPOINT_DATABASE_URL: ${AGENT_CHECKPOINT_DATABASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AGENT_PORT:-8100}:8100"
    profiles: ["agent"]

volumes:
  fatia_pg_data:
    name: fatia_pg_data
