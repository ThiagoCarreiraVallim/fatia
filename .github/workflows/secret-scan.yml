name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Regra nova de detecção só ajuda se alguém rodar de novo sobre o histórico
  # antigo. Segunda-feira 06:00 (America/Sao_Paulo = 09:00 UTC), junto do
  # Dependabot.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (histórico completo)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # O gitleaks varre patches de commit. Com o clone raso padrão o job
          # olharia só o último e passaria verde sobre segredo commitado ontem.
          fetch-depth: 0

      # Roda ANTES da varredura: o verde da varredura só quer dizer alguma coisa
      # se ela ainda enxerga o que promete enxergar. Cada caso do autoteste é um
      # jeito conhecido de ela passar verde sem olhar (merge commit fora do
      # `git log -p`, falha de infra confundida com achado).
      - name: Autoteste da varredura
        run: ./scripts/secret-scan-selftest.sh

      - name: Varredura de segredo
        run: ./scripts/secret-scan.sh
